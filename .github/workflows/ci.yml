name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install tensorflow-cpu fastapi "uvicorn[standard]" python-multipart pillow numpy httpx pytest
      - run: pytest -q
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
